<!DOCTYPE html>
<html lang="tr">

<head>
    <!-- Karakter kodlaması ve mobil cihazlar için responsive ekran tanımı -->
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ana Sayfa/Kırtasiye </title>
    <!-- Projenin harici CSS stil dosyası bağlantısı -->
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <!-- ========================================================================= -->
    <!-- 1. ÜST KAMPANYA VE DUYURU BANNERI -->
    <!-- ========================================================================= -->
    <header>
        <!-- <nav>
            <a href="#">Ana Sayfa</a>
        </nav> -->
        <img class="header-img"
            src="https://i.dr.com.tr/pimages/Content/Uploads/BannerFiles/dr/2026-TEMMUZ-SERINLETEN-URUNLER-HELLO-BAR1140X60.webp"
            alt="">
    </header>

    <!-- ========================================================================= -->
    <!-- 2. ANA HEADER (LOGO, ARAMA FORMU, İNDİRİMLER VE KULLANICI DROPDOWN MENÜSÜ) -->
    <!-- ========================================================================= -->
    <header class="header1">

        <!-- Logo alanı: Ana sayfaya yönlendirir -->
        <!-- LOGO -->
        <div class="logo">
            <a href="index.html">
                <img class="logo_img" src="/image/logo.jpg" alt="Logo">
            </a>
        </div>

        <!-- Ürün Arama Çubuğu: Backend /api/genel endpoint'ine GET isteği gönderir -->
        <!-- SEARCH -->
        <div class="search-box">
            <form class="search-container" action="http://localhost:5192/api/genel" method="GET" role="search">

                <div class="search-input-wrapper">
                    <input type="search" class="search-input" name="kelime"
                        placeholder="Ürün, kategori veya marka arayın..." maxlength="60" autocomplete="off"
                        aria-label="Ürün arama" />
                </div>

                <button type="submit" class="search-submit-btn">Ara</button>
            </form>
        </div>

        <!-- İndirimli ürünleri doğrudan filtreleyen tetikleyici buton (script.js üzerinden yönetilir) -->
        <span><button class="search-discount" type="button" onclick="indirimliUrunleriGetir()">İndirimli
                Ürünler</button></span>

        <!-- Kullanıcı Durum & Aksiyon Menüsü (Giriş/Kayıt, Profil Dropdown, Favoriler, Sepet) -->
        <div class="header1-actions">

            <!-- Ziyaretçi Giriş/Kayıt Butonu (Kullanıcı giriş yaptığında 'd-none' eklenir) -->
            <a href="uye.html" class="header1-item" id="nav-login-btn">
                <span class="icon">👤</span>
                <span>Giriş Yap/Kayıt Ol</span>
            </a>

            <!-- Aktif Kullanıcı Profil Menüsü (Oturum açıkken 'd-none' kaldırılarak gösterilir) -->
            <div class="header1-item user-dropdown d-none" id="user-menu">
                <div class="user-dropdown-trigger">
                    <span class="icon">👤</span>
                    <span>Hesabım</span>
                </div>
                <div class="dropdown-content">
                    <div class="user-info-row">
                        <!-- Kullanıcı ad-soyad baş harfleri avatarı -->
                        <div class="user-avatar" id="user-avatar-badge">BÇ</div>
                        <div class="user-details">
                            <span class="greeting">Merhaba</span>
                            <!-- Kullanıcı tam adı dinamik basılır -->
                            <span class="user-fullname" id="user-fullname">Berkay ÇÜRÜK</span>
                        </div>
                    </div>
                    <hr class="dropdown-divider">

                    <!-- Kullanıcı profil/adres yönetim linki -->
                    <a href="hesabim.html" class="dropdown-menu-item"
                        style="display: flex; align-items: center; gap: 8px; padding: 8px 12px; text-decoration: none; color: #334155; font-size: 14px; border-radius: 6px; transition: background-color 0.2s;">
                        <span>👤</span>
                        <span>Hesabım</span>
                    </a>

                    <hr class="dropdown-divider">

                    <!-- Siparişlerim sayfası linki -->
                    <a href="siparis.html" class="dropdown-menu-item"
                        style="display: flex; align-items: center; gap: 8px; padding: 8px 12px; text-decoration: none; color: #334155; font-size: 14px; border-radius: 6px; transition: background-color 0.2s;">
                        <span>📦</span>
                        <span>Siparişlerim</span>
                    </a>

                    <hr class="dropdown-divider">
                    <!-- Oturumu kapatıp localStorage'ı temizleyen buton -->
                    <button id="logout-btn" class="logout-link" type="button">Çıkış Yap</button>
                </div>
            </div>

            <!-- Favorilerim Kısayolu -->
            <a href="favoriler.html" class="header1-item">
                <span class="icon">♡</span>
                <span>Favoriler</span>
            </a>

            <!-- Sepetim Kısayolu -->
            <a href="sepet.html" class="header1-item">
                <span class="icon">🛒</span>
                <span>Sepetim</span>
            </a>

        </div>

    </header>

    <!-- Kategori Menü Butonları -->
    <div class="kategori-div">
        <span><button class="kategori" type="button"><a href='kitaplar.html'>Kitaplar</a></button></span>
        <span><button class="kategori" type="button"><a href='elektronik.html'>Elektronik</a></button></span>
        <span><button class="kategori" type="button"><a href='hobi.html'>Hobi</a></button></span>
        <span><button class="kategori" type="button"><a href='kirtasiye.html'>Kırtasiye</a></button></span>
    </div>

    <!-- Sayfa Navigasyon Breadcrumb Başlığı -->
    <h5 class="kitaplar-ana-sayfa-kitaplar">Ana Sayfa/Kırtasiye</h5>

    <!-- ========================================================================= -->
    <!-- 3. KIRTASİYE ALT KATEGORİ SLIDER ALANI (KALEM, DEFTER, ÇANTA VB.) -->
    <!-- Tıklanan kartın 'data-kelime' değeri üzerinden script.js aramayı tetikler -->
    <!-- ========================================================================= -->
    <div class="kitaplar-section">
        <span>
            <h2 class="kitaplar-baslik">Kırtasiye</h2>
        </span>

        <!-- YAYINEVİSCROLL-->
        <div class="brand-slider-wrapper">

            <!-- Slider sol kaydırma butonu -->
            <button class="slider-btn prev-btn" id="slideLeft" aria-label="Sola Kaydır">&#10094;</button>

            <!-- Kaydırılabilir kırtasiye alt kategori kartları pisti -->
            <div class="brand-slider-track" id="sliderTrack">

                <div class="brand-slide-item">
                    <a href="#" class="arama-butonu" data-kelime="kalem" title="Kalemler">
                        <img src="image/kalemler.jpg" alt="kalem">
                    </a>
                    <strong><span class="brand-slide-title">Kalemler</span></strong>
                </div>
                <div class="brand-slide-item">
                    <a href="#" class="arama-butonu" data-kelime="def" title="Defterler">
                        <img src="image/defter.jpg" alt="Defter">
                    </a>
                    <strong><span class="brand-slide-title">Defterler</span></strong>
                </div>

                <div class="brand-slide-item">
                    <a href="#" class="arama-butonu" data-kelime="sırt çanta" title="Sırt Çantası">
                        <img src="image/sırtcanta.jpg" alt="Sırt Çantası">
                    </a>
                    <strong><span class="brand-slide-title">Sırt Çantası</span></strong>
                </div>

                <div class="brand-slide-item">
                    <a href="#" class="arama-butonu" data-kelime=" kalem çanta" title="Kalem Çantası">
                        <img src="image/kalemcanta.jpg" alt="Kalem Çantası">
                    </a>
                    <strong><span class="brand-slide-title">Kalemlikler</span></strong>
                </div>

                <div class="brand-slide-item">
                    <a href="#" class="arama-butonu" data-kelime="matara" title="Mataralar">
                        <img src="image/mataralar.jpg" alt="Matara">
                    </a>
                    <strong><span class="brand-slide-title">Mataralar</span></strong>
                </div>

                <div class="brand-slide-item">
                    <a href="#" class="arama-butonu" data-kelime="boya" title="Boyalar">
                        <img src="image/boya.jpg" alt="Boyalar">
                    </a>
                    <strong><span class="brand-slide-title">Boyalar</span></strong>
                </div>
                <div class="brand-slide-item">
                    <a href="#" class="arama-butonu" data-kelime="klasör" title="Klasörler">
                        <img src="image/klasörler.jpg" alt="Klasörler">
                    </a>
                    <strong><span class="brand-slide-title">Klasörler</span></strong>
                </div>
                <div class="brand-slide-item">
                    <a href="#" class="arama-butonu" data-kelime="dosya" title="Dosyalar">
                        <img src="image/dosya.jpg" alt="Dosyalar">
                    </a>
                    <strong><span class="brand-slide-title">Dosyalar</span></strong>
                </div>

            </div>

            <!-- Slider sağ kaydırma butonu -->
            <button class="slider-btn next-btn" id="slideRight" aria-label="Sağa Kaydır">&#10095;</button>
        </div>
    </div>


    <!-- ========================================================================= -->
    <!-- 4. ÜRÜN LİSTELEME VE MARKA FİLTRELEME ALANI -->
    <!-- ========================================================================= -->
    <div class="product-section">

        <!-- SOL FİLTRELER: Kırtasiye markaları checkbox filtreleme kolonu -->
        <!-- SOL FİLTRELER -->
        <div class="filters-column">

            <!-- YAZAR -->
            <div class="checkbox-box">

                <h4>Marka seçin...</h4>

                <!-- Checkbox seçildiğinde script.js 'data-marka' özniteliği üzerinden ürünleri filtreler -->
                <div class="category-list">

                    <div class="check-item">
                        <input type="checkbox" id="yazar1" data-marka="Coral High">
                        <label for="yazar1">Coral High</label>
                    </div>

                    <div class="check-item">
                        <input type="checkbox" id="yazar2" data-marka="Jansport">
                        <label for="yazar2">Jansport</label>
                    </div>

                    <div class="check-item">
                        <input type="checkbox" id="yazar3" data-marka="DEPESCHE">
                        <label for="yazar3">DEPESCHE</label>
                    </div>

                    <div class="check-item">
                        <input type="checkbox" id="yazar4" data-marka="Eastpak">
                        <label for="yazar4">Eastpak</label>
                    </div>

                    <div class="check-item">
                        <input type="checkbox" id="yazar5" data-marka="Top Model">
                        <label for="yazar5">Top Model</label>
                    </div>

                    <div class="check-item">
                        <input type="checkbox" id="yazar6" data-marka="Benetton">
                        <label for="yazar6">Benetton</label>
                    </div>

                    <div class="check-item">
                        <input type="checkbox" id="yazar7" data-marka="Uzspace">
                        <label for="yazar7">Uzspace</label>
                    </div>

                    <div class="check-item">
                        <input type="checkbox" id="yazar8" data-marka="Disney Frozen">
                        <label for="yazar8">Disney Frozen</label>
                    </div>

                    <div class="check-item">
                        <input type="checkbox" id="yazar9" data-marka="Gap">
                        <label for="yazar9">Gap </label>
                    </div>

                    <div class="check-item">
                        <input type="checkbox" id="yazar10" data-marka="U.S.Polo">
                        <label for="yazar10">U.S.Polo</label>
                    </div>

                    <div class="check-item">
                        <input type="checkbox" id="yazar11" data-marka="Kaukko">
                        <label for="yazar11">Kaukko</label>
                    </div>
                    <div class="check-item">
                        <input type="checkbox" id="yazar13" data-marka="KAUKKO KIDS">
                        <label for="yazar13">KAUKKO KIDS</label>
                    </div>
                    <div class="check-item">
                        <input type="checkbox" id="yazar12" data-marka="VAGONLİFE">
                        <label for="yazar12">VAGONLİFE</label>
                    </div>
                    <div class="check-item">
                        <input type="checkbox" id="yazar14" data-marka="Minisso">
                        <label for="yazar14">Minisso</label>
                    </div>
                    <div class="check-item">
                        <input type="checkbox" id="yazar15" data-marka="Timberland">
                        <label for="yazar15">Timberland</label>
                    </div>

                </div>
            </div>



        </div>


        <!-- SAĞ ÜRÜN LİSTELEME GRID ALANI -->
        <!-- script.js tarafından çekilen kırtasiye ürün kartları ve sayfalama bu gridlere basılır -->
        <!-- SAĞ ÜRÜNLER -->
        <div class="products-area">

            <!-- Kırtasiye kategorisine ait ürünlerin varsayılan olarak basıldığı ana grid -->
            <div class="products-grid" id="kirtasiye"></div>

            <!-- Arama sonuçlarının basıldığı grid -->
            <div class="products-grid" id="aramaSonuclari"></div>

            <!-- İndirimli ürünler filtresi sonuçlarının basıldığı grid -->
            <div class="products-grid" id="indirimliGrid"></div>

            <!-- Sayfalama (Pagination) butonlarının dinamik oluşturulduğu alan -->
            <div class="pagination" id="pagination">
            </div>

        </div>
        <!-- JavaScript buraya 30 ürün ekleyecek -->

    </div>

    </div>

    <!-- Genel site etkileşimleri, API istekleri ve slider mekanizması scripti -->
    <script src="script.js"></script>

    <script>
        // Sayfa yüklendiğinde kullanıcı oturumunu kontrol et ve header'ı senkronize et
        document.addEventListener('DOMContentLoaded', () => {
            if (typeof kullaniciDurumunuKontrolEt === 'function') {
                kullaniciDurumunuKontrolEt();
            }
        });
    </script>
</body>

</html>
